<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatveyGame - Открытие кейсов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #17212b;
            --tg-theme-text-color: #ffffff;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-hint-color: #6c7883;
            --tg-theme-secondary-bg-color: #0e1621;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--tg-theme-secondary-bg-color);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .balance {
            font-size: 20px;
            margin-bottom: 24px;
            color: #2481cc;
            font-weight: bold;
        }

        .case-box {
            width: 120px;
            height: 120px;
            background: rgba(36, 129, 204, 0.2);
            border: 2px solid var(--tg-theme-button-color);
            border-radius: 24px;
            margin: 0 auto 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .case-box:active {
            transform: scale(0.95);
            background: rgba(36, 129, 204, 0.4);
        }

        .case-box span {
            font-size: 44px;
        }

        .case-box p {
            margin-top: 8px;
            font-size: 14px;
            font-weight: bold;
        }

        .price-info {
            font-size: 14px;
            color: var(--tg-theme-hint-color);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }

        .btn:active {
            opacity: 0.8;
        }

        .result-box {
            margin-top: 24px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #4caf50;
            min-height: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎁 Открытие кейсов</h1>
        <div class="balance">Баланс: <span id="balance">100</span> монет</div>
        
        <div class="price-info">
            Стоимость открытия: 15 монет.<br>
            Внутри могут выпасть призы: <b>9, 15, 20, 25 или 50 монет</b>!
        </div>

        <div class="case-box" onclick="openCase()">
            <span>📦</span>
            <p>Открыть</p>
        </div>

        <button class="btn" onclick="openCase()">Открыть кейс</button>
        
        <div class="result-box" id="result">Нажмите на кейс, чтобы проверить удачу!</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 100;

        function openCase() {
            let cost = 15;

            if (balance < cost) {
                tg.showPopup({
                    title: 'Ошибка',
                    message: 'Недостаточно монет для открытия кейса. Пополните баланс!',
                    buttons: [{type: 'ok', text: 'Понятно'}]
                });
                return;
            }

            balance -= cost;
            document.getElementById('balance').innerText = balance;

            let prizes = [9, 15, 20, 25, 50];
            let randomIndex = Math.floor(Math.random() * prizes.length);
            let prize = prizes[randomIndex];

            balance += prize;
            document.getElementById('balance').innerText = balance;

            document.getElementById('result').innerText = `🎉 Вам выпало: +${prize} монет!`;
            
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
